<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ألعاب عدنان - الصفحة الرئيسية</title>
    <style>
        body {
            /* ضع رابط صورتك المفضلة بدلاً من الرابط أدناه */
            background-image: url('https://images.unsplash.com/photo-1550745165-9bc0b252726f');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding: 0;
            margin: 0;
            color: white;
        }
        /* شريط التنقل العلوي والقائمة وثلاث خطوط */
        .navbar {
            background-color: rgba(0, 0, 0, 0.8);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #ff4757;
        }
        .menu-icon {
            font-size: 24px;
            cursor: pointer;
            background: none;
            border: none;
            color: white;
        }
        /* صندوق البحث */
        .search-container {
            margin: 25px auto;
        }
        .search-box {
            padding: 10px 15px;
            width: 80%;
            max-width: 350px;
            border-radius: 20px;
            border: none;
            outline: none;
            font-size: 16px;
            text-align: right;
        }
        /* قسم العنوان */
        header {
            background-color: rgba(44, 62, 80, 0.85);
            padding: 20px;
            margin: 20px auto;
            max-width: 600px;
            border-radius: 10px;
        }
        h1 {
            margin: 0;
            font-size: 26px;
        }
        p.desc {
            color: #ecf0f1;
            font-size: 15px;
            margin-top: 10px;
        }
        /* بطاقة اللعبة */
        .game-card {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            border-radius: 10px;
            padding: 20px;
            margin: 20px auto;
            max-width: 400px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            text-align: right;
        }
        .game-card h3 {
            color: #2c3e50;
            margin-top: 0;
        }
        .game-card p {
            color: #666;
            font-size: 14px;
        }
        .btn-download {
            display: block;
            background-color: #27ae60;
            color: white;
            text-align: center;
            padding: 12px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 15px;
        }
        .btn-download:hover {
            background-color: #219653;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">🎮 ألعاب عدنان</div>
        <button class="menu-icon">☰</button>
    </div>

    <div class="search-container">
        <input type="text" class="search-box" placeholder="ابحث عن لعبتك هنا...">
    </div>

    <header>
        <h1>أهلاً بك في عالمي الخاص</h1>
        <p class="desc">حمل ألعابي الخاصة واستمتع بها مجاناً! 💖</p>
    </header>

    <div class="game-card">
        <h3>pes2021</h3>
        <p>لعبه كره قدم المشوره يس 21.</p>
        <a href="https://drive.google.com/file/d/1CuJVDbPL37sRrE-Q_mPHNWdaAbQAQfrp/view?usp=sharing" class="btn-download"target="blank>📥 تحميل اللعبة الآن</a>
    </div>

</body>
</html>
